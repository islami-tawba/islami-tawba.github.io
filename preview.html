<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden;background:#0a0907}
body{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Amiri","Scheherazade New","Noto Naskh Arabic","Traditional Arabic","Geeza Pro","Arial",serif}
.pat{position:absolute;inset:0;width:100%;height:100%}
.inner{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:1080px;height:510px;border:2px solid #d4af37;border-radius:18px;outline:2px solid #d4af37;outline-offset:10px;background:#000}
.bism{color:#d4af37;font-size:44px;line-height:2;text-shadow:0 0 16px rgba(212,175,55,.4)}
.title{color:#d4af37;font-size:120px;line-height:1.5;font-weight:700;text-shadow:0 0 22px rgba(212,175,55,.5)}
.sub{color:#f1e3b5;font-size:44px;line-height:1.8}
</style>
</head>
<body>
<svg class="pat" aria-hidden="true"><defs><pattern id="p1" width="56" height="56" patternUnits="userSpaceOnUse"><g fill="none" stroke="#d4af37" stroke-opacity=".28" stroke-width="1"><rect x="14" y="14" width="28" height="28"/><rect x="14" y="14" width="28" height="28" transform="rotate(45 28 28)"/><circle cx="28" cy="28" r="9"/><circle cx="0" cy="0" r="9"/><circle cx="56" cy="0" r="9"/><circle cx="0" cy="56" r="9"/><circle cx="56" cy="56" r="9"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#p1)"/></svg>
<div class="inner">
  <div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
  <div class="title">إِسْلَامِي تَوْبَة</div>
  <div class="sub">تَسْبِيحٌ وَأَذْكَارُ الصَّبَاحِ وَالْمَسَاءِ</div>
</div>
</body>
</html>
