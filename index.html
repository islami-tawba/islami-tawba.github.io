<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0907">
<title>إسلامي توبة</title>
<style>
*{box-sizing:border-box}
:root{--g:#d4af37;--g2:#f1e3b5;--g3:#b99a4b;--bg:#0a0907}
html,body{margin:0;background:var(--bg);color:var(--g2)}
body{font-family:"Amiri","Scheherazade New","Noto Naskh Arabic","Traditional Arabic","Geeza Pro","Arial",serif;line-height:1.9;font-size:16px;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 18px 40px}
button{font:inherit;color:inherit}
svg{display:block}
.band{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:22px 12px 8px;margin-bottom:22px;border:1px solid var(--g);border-radius:12px;outline:1px solid var(--g);outline-offset:4px;background:#000}
.band>*{position:relative}
.pat{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bism{color:var(--g);font-size:20px;line-height:2;text-shadow:0 0 12px rgba(212,175,55,.35)}
.title{color:var(--g);font-size:40px;line-height:1.6;font-weight:700;text-shadow:0 0 14px rgba(212,175,55,.45);padding-bottom:8px}
.div{width:min(300px,80%);height:20px;margin:10px auto}
h2{color:var(--g);font-size:22px;font-weight:700;margin:18px 0 6px}
.zikr{color:var(--g);font-size:34px;line-height:1.8;text-align:center;padding:6px 0;min-height:1.8em}
.circle{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(290px,78vw);aspect-ratio:1;margin:12px auto;padding:0;border-radius:50%;border:0;background:radial-gradient(circle at 50% 40%,#1b1608,#000 70%);color:var(--g);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 0 24px rgba(212,175,55,.18)}
.circle:active{background:radial-gradient(circle at 50% 40%,#2a2210,#0a0907 70%)}
.circle.done{box-shadow:0 0 34px rgba(212,175,55,.55)}
.ring{position:absolute;inset:0;width:100%;height:100%}
.num{position:relative;font-size:70px;line-height:1.1;font-weight:700;font-family:Georgia,serif}
.of{position:relative;color:var(--g2);font-size:16px}
.done-msg{text-align:center;color:var(--g);margin:6px 0;min-height:1.9em}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;align-items:center}
.btn{min-height:44px;padding:6px 16px;border:1px solid #5b4b24;border-radius:6px;background:#14110a;cursor:pointer}
.btn.sel{background:var(--g);color:var(--bg);border-color:var(--g);font-weight:700}
.btn.ghost{background:transparent}
.lbl{color:var(--g)}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 10px;border:0;border-bottom:1px solid #3a2f14;background:none;text-align:start;cursor:pointer;border-radius:4px}
.item[aria-pressed="true"]{background:#1d1709;box-shadow:inset -3px 0 0 var(--g)}
.item .n{color:var(--g3);min-width:1.5em;font-family:Georgia,serif}
.item .t{flex:1}
.item .t b{display:block;font-weight:700;font-size:18px}
.item .t small{color:var(--g3);font-size:14px}
.item .c{color:var(--g);font-family:Georgia,serif;font-weight:700}
.total{text-align:center;color:var(--g);margin:12px 0 0}
.foot{text-align:center;color:var(--g3);font-size:14px;margin-top:6px}
</style>
</head>
<body>
<main>
  <header class="band">
    <svg class="pat" aria-hidden="true"><defs><pattern id="p1" width="56" height="56" patternUnits="userSpaceOnUse"><g fill="none" stroke="#d4af37" stroke-opacity=".28" stroke-width="1"><rect x="14" y="14" width="28" height="28"/><rect x="14" y="14" width="28" height="28" transform="rotate(45 28 28)"/><circle cx="28" cy="28" r="9"/><circle cx="0" cy="0" r="9"/><circle cx="56" cy="0" r="9"/><circle cx="0" cy="56" r="9"/><circle cx="56" cy="56" r="9"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#p1)"/></svg>
    <span class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
    <svg class="div" viewBox="0 0 300 20" aria-hidden="true"><use href="#divider"/></svg>
    <h1 class="title" style="margin:0">إِسْلَامِي تَوْبَة</h1>
  </header>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="divider"><path d="M0 10H120M180 10H300" stroke="#d4af37" stroke-width=".8"/><g fill="none" stroke="#d4af37" stroke-width="1"><rect x="141" y="1" width="18" height="18" transform="rotate(45 150 10)"/><rect x="144" y="4" width="12" height="12"/></g><circle cx="126" cy="10" r="2" fill="#d4af37"/><circle cx="174" cy="10" r="2" fill="#d4af37"/></g></defs></svg>

  <h2>الْعَدَّادُ</h2>
  <div class="zikr" id="zikr" aria-live="polite"></div>
  <button type="button" class="circle" id="circle">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true" id="ring"></svg>
    <span class="num" id="num">0</span>
    <span class="of" id="of"></span>
  </button>
  <div class="done-msg" id="doneMsg"></div>
  <div class="row">
    <button type="button" class="btn" id="undo">تَرَاجَعْ خُطْوَةً</button>
    <button type="button" class="btn ghost" id="reset">ابْدَأْ مِنَ الصِّفْرِ</button>
  </div>
  <div class="row" id="targets"><span class="lbl">الْهَدَفُ</span></div>

  <svg class="div" viewBox="0 0 300 20" aria-hidden="true"><use href="#divider"/></svg>
  <h2>اخْتَرِ الذِّكْرَ</h2>
  <ul class="list" id="list"></ul>
  <p class="total">الْمَجْمُوعُ: <bdi id="total">0</bdi></p>
  <svg class="div" viewBox="0 0 300 20" aria-hidden="true"><use href="#divider"/></svg>
  <p class="foot">تَقَبَّلَ اللَّهُ مِنَّا وَمِنْكُمْ.</p>
</main>
<script>
(function(){
  var adhkar=[
    {id:'subhan',t:'سُبْحَانَ اللَّهِ',g:33},
    {id:'hamd',t:'الْحَمْدُ لِلَّهِ',g:33},
    {id:'akbar',t:'اللَّهُ أَكْبَرُ',g:34},
    {id:'tahlil',t:'لَا إِلَٰهَ إِلَّا اللَّهُ',g:100},
    {id:'subhan-hamd',t:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',g:100},
    {id:'azim',t:'سُبْحَانَ اللَّهِ الْعَظِيمِ',g:100},
    {id:'istighfar',t:'أَسْتَغْفِرُ اللَّهَ',g:100},
    {id:'hawqala',t:'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ',g:100},
    {id:'salat',t:'اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَىٰ نَبِيِّنَا مُحَمَّدٍ',g:100}
  ];
  var targets=[33,99,100,0];
  var KEY='islami-tawba.v1';
  var state={id:'subhan',counts:{},target:33};
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.counts&&s.id)state=s;}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function $(i){return document.getElementById(i)}
  var confirming=false;
  // ring ornament
  var ring='<circle cx="50" cy="50" r="49" fill="none" stroke="#d4af37" stroke-width=".8"/><circle cx="50" cy="50" r="38" fill="none" stroke="#d4af37" stroke-width=".5" stroke-opacity=".8"/>';
  for(var a=0;a<360;a+=15){
    ring+='<g transform="rotate('+a+' 50 50)"><path d="M50 3L53 9L50 15L47 9Z" fill="#d4af37"/><circle cx="50" cy="19.5" r="1.1" fill="#d4af37"/></g>';
    ring+='<g transform="rotate('+(a+7.5)+' 50 50)"><circle cx="50" cy="6.5" r=".9" fill="#d4af37" fill-opacity=".7"/></g>';
  }
  $('ring').innerHTML=ring;
  function cur(){for(var i=0;i<adhkar.length;i++)if(adhkar[i].id===state.id)return adhkar[i];return adhkar[0]}
  function render(){
    var d=cur(),c=state.counts[d.id]||0,t=state.target,done=t>0&&c>=t,total=0;
    for(var k in state.counts)total+=state.counts[k]||0;
    $('zikr').textContent=d.t;
    $('num').textContent=c;
    $('of').textContent=t>0?'مِنْ '+t:'بِلَا حَدٍّ';
    $('circle').className='circle'+(done?' done':'');
    $('circle').setAttribute('aria-label','عُدَّ '+d.t);
    $('doneMsg').textContent=done?'اكْتَمَلَ الْهَدَفُ، تَقَبَّلَ اللَّهُ مِنْكَ':'';
    $('reset').textContent=confirming?'اضْغَطْ ثَانِيَةً لِلتَّأْكِيدِ':'ابْدَأْ مِنَ الصِّفْرِ';
    $('total').textContent=total;
    var tg=$('targets');while(tg.children.length>1)tg.removeChild(tg.lastChild);
    targets.forEach(function(v){var b=document.createElement('button');b.type='button';b.className='btn'+(t===v?' sel':'');b.textContent=v===0?'بِلَا حَدٍّ':v;b.onclick=function(){state.target=v;save();render()};tg.appendChild(b)});
    var ul=$('list');ul.innerHTML='';
    adhkar.forEach(function(x,i){
      var li=document.createElement('li'),b=document.createElement('button');
      b.type='button';b.className='item';b.setAttribute('aria-pressed',x.id===state.id);
      b.innerHTML='<span class="n">'+(i+1)+'.</span><span class="t"><b></b><small></small></span><span class="c"></span>';
      b.querySelector('b').textContent=x.t;
      b.querySelector('small').textContent='الْهَدَفُ الْمُعْتَادُ '+x.g;
      var n=state.counts[x.id]||0;b.querySelector('.c').textContent=n?n:'';
      b.onclick=function(){state.id=x.id;state.target=x.g;confirming=false;save();render()};
      li.appendChild(b);ul.appendChild(li);
    });
  }
  $('circle').onclick=function(){var d=cur();state.counts[d.id]=(state.counts[d.id]||0)+1;confirming=false;save();render();if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}};
  $('undo').onclick=function(){var d=cur();if((state.counts[d.id]||0)>0){state.counts[d.id]--;save();render()}};
  $('reset').onclick=function(){var d=cur();if(!confirming){confirming=true;render();return}state.counts[d.id]=0;confirming=false;save();render()};
  render();
})();
</script>
</body>
</html>
